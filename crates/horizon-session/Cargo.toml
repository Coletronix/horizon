[package]
name = "horizon-session"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "The Wayland compositor that owns the desktop's programs and their windows, which the game shows: programs outlive the game"

[[bin]]
name = "horizon-session"
path = "src/main.rs"

[dependencies]
horizon-wm-ipc = { path = "../horizon-wm-ipc" }
log = { version = "0.4", features = ["std"] }

[target.'cfg(target_os = "linux")'.dependencies]
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "desktop", "xwayland"] }
calloop = { version = "0.14", features = ["signals"] }
rustix = { version = "1.1", default-features = false, features = ["std", "process"] }
