[package]
name = "horizon-wm-ipc"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "The private protocol between horizon-session (the Wayland compositor that owns the desktop's programs) and the game that shows their windows"

[dependencies]
serde = { version = "1", features = ["derive"] }
postcard = { version = "=1.1.3", default-features = false, features = ["alloc"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", default-features = false, features = ["std", "net", "time"] }
