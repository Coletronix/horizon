[package]
name = "mod-wayland_wm"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false
description = "A Wayland compositor inside the game, whose windows presenter mods show and drive"

[lib]
name = "wayland_wm"
path = "src/lib.rs"

[dependencies]
# In a published mod this is the pinned SDK's copy (.horizon/sdk/api/crates/horizon-mod-api);
# in this checkout it is the workspace's own, so engine changes reach the mod at once.
horizon-mod-api = { path = "../../crates/horizon-mod-api" }
log = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend", "desktop"] }
