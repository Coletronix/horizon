id = "wayland_wm"
name = "Wayland Window Manager"
version = "0.1.0"
description = "Runs a Wayland compositor inside the game: Linux programs open their windows into Minecraft. How windows are shown and used is up to presenter mods that depend on this one."
authors = []
# A native mod: Rust in src/, compiled by the launcher against the game build [native] pins.
api = "0.2"
side = "client"
# The content API every mod declares (registries: "May add blocks, items, mob effects and entity types").
capabilities = ["registries"]

# Pinned to the Nightly this branch starts from; the engine changes it needs (live textures,
# dmabuf import) aren't in a published build yet, so build it with wayland-wm-dev in this checkout.
[native]
game = "26.3"
horizon = "0a875da91dbb0fdcb7ba8c42c11341aa229af51a"
mixins = "e59da9094f0c2fdda6c627fe9eff22dec6a906f0"
